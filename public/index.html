<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE 客戶管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>LINE 客戶管理</h1>
    <select id="brand-switch" title="切換品牌"><option value="">全部品牌</option></select>
    <nav>
      <button data-tab="focus" class="active">今日關懷</button>
      <button data-tab="repurchase">回訪</button>
      <button data-tab="customers">客戶</button>
      <button data-tab="orders">訂單</button>
      <button data-tab="brands">品牌</button>
    </nav>
    <form id="search-form" class="search-bar" role="search">
      <input id="search-q" type="search" placeholder="搜尋客戶、電話、航班、地點、對話、#訂單號…" aria-label="搜尋">
      <input id="search-from" type="date" title="用車日（從）" aria-label="從">
      <span class="muted">～</span>
      <input id="search-to" type="date" title="用車日（到）" aria-label="到">
      <button type="submit">搜尋</button>
    </form>
    <div id="status" class="muted"></div>
  </header>

  <main>
    <section id="tab-focus">
      <div class="toolbar">
        <h2 id="focus-title">今日關懷清單</h2>
        <span class="spacer"></span>
        <button id="run-daily" class="secondary" title="立即執行每日排程（自動提醒 + 推播清單給客服）">立即推播清單給客服</button>
        <button id="refresh-focus" class="secondary">重新整理</button>
      </div>
      <div id="focus-list"></div>
    </section>

    <section id="tab-repurchase" hidden>
      <div class="toolbar">
        <h2>回訪追蹤</h2>
        <div class="seg" id="repurchase-filter">
          <button data-filter="due" class="active">可邀請了</button>
          <button data-filter="soon">7 天內</button>
          <button data-filter="dormant">沉睡客</button>
          <button data-filter="all">全部</button>
        </div>
        <span class="spacer"></span>
        <span class="muted" id="repurchase-summary"></span>
      </div>
      <div class="table-wrap"><table id="repurchase-table"></table></div>
    </section>

    <section id="tab-customers" hidden>
      <div class="toolbar">
        <input id="customer-q" type="search" placeholder="搜尋名稱、電話、備註…">
        <input id="customer-tag" type="search" placeholder="標籤" size="8">
        <span class="spacer"></span>
        <a class="button secondary" id="export-customers" href="/api/export/customers.csv">匯出 CSV</a>
        <button id="find-duplicates" class="secondary">找重複客戶</button>
        <button id="import-data" class="secondary">匯入舊資料</button>
        <button id="new-customer">新增客戶</button>
      </div>
      <div class="table-wrap"><table id="customer-table"></table></div>
    </section>

    <section id="tab-orders" hidden>
      <div class="toolbar">
        <select id="order-when"><option value="upcoming">即將用車（7 天內）</option><option value="">全部訂單</option></select>
        <select id="order-status"><option value="">全部狀態</option></select>
        <span class="spacer"></span>
        <a class="button secondary" id="export-orders" href="/api/export/orders.csv">匯出訂單 CSV</a>
      </div>
      <div class="table-wrap"><table id="order-table"></table></div>
    </section>
    <section id="tab-search" hidden>
      <div class="toolbar"><h2 id="search-title">搜尋結果</h2><span class="spacer"></span><button id="search-clear" class="secondary">清除搜尋</button></div>
      <div id="search-results"></div>
    </section>
    <section id="tab-brands" hidden>
      <div class="toolbar">
        <h2>品牌與 LINE 官方帳號</h2>
        <span class="spacer"></span>
        <a class="button secondary" href="/api/export/backup.db" title="下載完整資料庫備份（含所有品牌、客戶、訂單、對話）">下載備份</a>
        <button id="new-brand">新增品牌</button>
      </div>
      <p class="muted">每個品牌對應一個 LINE 官方帳號。到 LINE Developers 該帳號的 Messaging API 設定頁，把 Webhook URL 設成下方顯示的網址。</p>
      <div id="brand-list"></div>
      <h3>每日清單通知對象（客服）</h3>
      <p class="muted">客服用自己的 LINE 加任一品牌官方帳號好友並傳一則訊息，再到「客戶」找到這位客服、點「設為客服」。每天的清單（含所有品牌）會由該品牌的帳號推播給對方。</p>
      <div id="staff-list" class="card"></div>
    </section>
  </main>

  <dialog id="drawer">
    <div id="drawer-body"></div>
  </dialog>

  <div id="toast" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
