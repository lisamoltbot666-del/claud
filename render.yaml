# Render Blueprint：在 Render 按「New → Blueprint」選這個 repo 就會照這裡建立服務
# 說明：docs/deploy-render.md
services:
  - type: web
    name: line-crm
    runtime: node
    # 需要付費方案才能掛載永久磁碟（資料庫存在磁碟上，免費方案重新部署會遺失資料）
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /var/data/crm.db
      - key: TZ_NAME
        value: Asia/Taipei
      # 後台密碼：建立時 Render 會請你填
      - key: ADMIN_PASSWORD
        sync: false
      - key: DAILY_REPORT_HOUR
        value: "9"
      - key: WEEKLY_REPORT_DAY
        value: "1"
      - key: PAYMENT_DUE_DAYS
        value: "3"
      # 只用過一次車的客戶，預設幾天後邀請再次預約（回訪週期）
      - key: DEFAULT_REORDER_DAYS
        value: "90"
      - key: AUTO_PAYMENT_REMINDER
        value: "false"
      # 每天自動傳「行程確認」給明天用車的客戶（false = 由客服按按鈕發送）
      - key: AUTO_TRIP_REMINDER
        value: "false"
      - key: AUTO_REORDER_REMINDER
        value: "false"
      # 客人傳「查訂單」、匯款通知時是否自動回覆（false = 只記錄、不回覆）
      - key: AUTO_REPLY
        value: "false"
      # 啟動時自動建立的品牌（代號:名稱:代表色）；只會建立一次，之後請在後台「品牌」頁修改
      - key: INITIAL_BRANDS
        value: "xiangyun:享運:#e8590c,lumi:璐米:#d6336c,shouxi:首席:#1c7ed6,shike:時客:#2b8a3e,lijie:利捷:#7048e8"
